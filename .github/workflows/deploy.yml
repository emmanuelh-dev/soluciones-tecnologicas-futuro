name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          script: |
            export DOCKER_API_VERSION=1.44
            # Usamos la ruta absoluta para evitar errores de navegación
            cd $HOME/soluciones-tecnologicas-futuro/soluciones-tecnologicas-futuro
            git reset --hard
            git pull origin main
            docker-compose build --no-cache
            docker-compose up -d
            docker ps