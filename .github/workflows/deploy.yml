- name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.SSHKEY }}
          script: |
            export DOCKER_API_VERSION=1.44
            cd $HOME/soluciones-tecnologicas-futuro/soluciones-tecnologicas-futuro
            git reset --hard
            git pull origin main
            docker-compose build --no-cache
            docker-compose up -d
            docker ps
            echo "✓ Despliegue con contraseña completado"