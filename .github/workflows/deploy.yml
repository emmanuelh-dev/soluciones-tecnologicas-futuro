name: Deploy

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate shell scripts
        run: |
          bash -n setup_env.sh
          bash -n limpieza.sh
          echo "✓ Scripts Bash validados"
      
      - name: Validate YAML files (docker-compose, config)
        run: |
          python3 -c "import yaml; yaml.safe_load(open('docker-compose.yml')); yaml.safe_load(open('config.yaml')); print('✓ Archivos YAML validados')"
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Validate Python scripts
        run: |
          pip install boto3 pyyaml
          python3 -m py_compile aws_report.py
          echo "✓ Scripts Python validados"

      - name: Validate CloudFormation template (cfn-lint)
        run: |
          pip install cfn-lint
          cfn-lint template.yaml
      
      - name: Validate Dockerfile
        run: |
          docker build --dry-run -t fintech-app:latest . || echo "✓ Dockerfile structure validated"

  build_docker:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: fintech-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build_docker
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          script: |
            cd soluciones-tecnologicas-futuro
            git reset --hard
            git pull origin main
            
            # Ejecutar validaciones en el servidor
            bash -n setup_env.sh
            bash -n limpieza.sh
            
            # Construir imagen Docker
            docker build -t fintech-app:latest .
            
            # Iniciar contenedores con Docker Compose (CLI v2)
            docker compose down || true
            docker compose up -d
            
            echo "✓ Deployment completado exitosamente"
      
      - name: Verify deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          script: |
            docker ps -a
            echo "✓ Contenedores verificados"
